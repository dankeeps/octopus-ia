function ttVigiar(){ clearTimeout(TT.timer); if(!TT.busca||TT.busca.status!=='buscando') return;
  TT.timer=setTimeout(async()=>{ try{ const b=(await ttApi('/busca?id='+TT.busca.id)).busca, mudou=b.status!==TT.busca.status; TT.busca=b; if(mudou){ ttCarregar(true); if(b.status==='pronta') toast(`${b.videos.length} vídeos do TikTok`); } }catch(e){} ttVigiar(); },3000); }
async function ttAcao(nome,id){
  try{
    if(nome==='buscar'){ const f=spyForm(); TT.busca=(await ttApi('/iniciar',{consulta:{palavras:spyTags(),pais:f.pais==='ALL'?'BR':f.pais,por_palavra:+f.ttMax||30,min_views:+f.ttMin||0,ordem:f.ttOrdem||'MOST_RELEVANT',periodo:f.ttPeriodo||'ALL_TIME'}})).busca; ttVigiar(); ttCarregar(true); }
    else if(nome==='parar'){ TT.busca=(await ttApi('/parar',{id:TT.busca.id})).busca; ttCarregar(true); }
    else if(nome==='apagar'){ TT.info.recentes=(await ttApi('/apagar',{id})).recentes; if(TT.busca&&TT.busca.id===id) TT.busca=null; }

}

/* histórico de uma biblioteca: "2026-10-05 · 42" → {dia, n}; e o gráfico de linha (área) que cresce para a direita */
function spyPontos(h){ return (h||[]).map(x=>{ const [d,n]=String(x).split('·').map(t=>t.trim()); return {dia:d,n:+n||0}; }).filter(x=>x.dia); }
function spyGrafico(v,w,h){
  if(v.length===1) v=[v[0],v[0]];
  const mx=Math.max(1,...v), mn=Math.min(...v), f=mx===mn?1:(mx-mn), px=i=>(i/(v.length-1)*(w-4)+2).toFixed(1), py=x=>(h-3-((x-mn)/f)*(h-7)).toFixed(1);
  const pts=v.map((x,i)=>px(i)+','+py(x)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="2,${h-1} ${pts} ${w-2},${h-1}" fill="var(--acc)" opacity=".16"/><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${px(v.length-1)}" cy="${py(v[v.length-1])}" r="2.2" fill="var(--acc)"/></svg>`;
}

const app=document.getElementById('app');
let flowMontado=null, salvarT=null;
function flowAtual(){const p=proj(); return p&&(p.flows||[]).find(f=>f.id===S.ui.flowId);}
function desmontarFlow(){ if(flowMontado&&window.AtlasFlow) AtlasFlow.unmount(); flowMontado=null; }
/* acompanha a transcrição no servidor e atualiza o nó (a cada 2 s, enquanto o flow está aberto) */
const trAcomp={}, trEnvio={};
function acompanharTranscricao(fid,no,retomada){
  if(trAcomp[no]) return; trAcomp[no]=true;
  const passo=async()=>{
    const f=flowAtual();
    if(!f||f.id!==fid||!(f.nodes||[]).some(n=>n.id===no)){ delete trAcomp[no]; return; }
    try{
      const d=await fetch(`/api/transcricao/estado?flow=${encodeURIComponent(fid)}&no=${encodeURIComponent(no)}`,{headers:API}).then(r=>r.json());
      if(d.status==='nenhum'){ AtlasFlow.patch(no,{status:'erro',erro:retomada?'A transcrição parou porque o Octopus IA foi fechado. Suba o vídeo de novo.':'A transcrição não começou. Suba o vídeo de novo.'}); delete trAcomp[no]; return; }
      AtlasFlow.patch(no,{status:d.status,progresso:d.progresso||0,duracao:d.duracao||null,arquivo:d.arquivo||null,chars:d.chars||0,erro:d.erro||null});
      if(d.status==='pronto'){ toast('Transcrição pronta'); setTimeout(()=>AtlasFlow.refresh(),50); }
      if(d.status==='cancelado'){ AtlasFlow.patch(no,{status:'',video:null,progresso:0,erro:null}); delete trAcomp[no]; return; }
      if(['pronto','erro'].includes(d.status)){ delete trAcomp[no]; return; }
    }catch(e){}
    setTimeout(passo,2000);
  };
  setTimeout(passo,800);
}
function renderFlow(){
  const f=flowAtual();
  if(!window.AtlasFlow){ setTimeout(render,60); return; }
  if(flowMontado!==f.id){
    desmontarFlow();
    app.innerHTML=`<div class="flowwrap"><div id="flowroot"></div><div id="flowui"></div></div>`;
    AtlasFlow.mount(document.getElementById('flowroot'), f, FLOW_CB); flowMontado=f.id;
    (f.nodes||[]).filter(n=>n.type==='transcricao'&&['enviando','na fila','transcrevendo'].includes(n.data.status)).forEach(n=>acompanharTranscricao(f.id,n.id,true));
    if(S.ui.foco){ const alvo=S.ui.foco; setTimeout(()=>{ AtlasFlow.focar(alvo); },450); }
  }
  document.getElementById('flowui').innerHTML=vFlowUI(f);
  const ta=document.getElementById('msg'); if(ta){autosize(ta); const m=document.querySelector('.msgs'); if(m) m.scrollTop=m.scrollHeight;}
  AtlasFlow.refresh();
}

/* ============ Criativos › Auditoria: o controle de mercado da oferta (lido das notas do cofre, sem IA) ============ */
const CM={ofertas:null,dados:null,sel:null,oferta:'',origem:'',tab:'geral',cat:'Dores',q:'',ctx:null,narr:null,ad:null,erro:null,carregando:false};
const CM_CATS=['Dores','Desejos','Promessas','Provas','Mecanismo','Soluções comuns'];
const CM_TABS=[
  {id:'geral',nome:'Elementos persuasivos',n:d=>CM_CATS.reduce((s,c)=>s+d.geral[c].length,0),intro:'A ideia, de qualquer jeito que foi falada. Conta todo anúncio que traz aquela dor, desejo, promessa, prova, mecanismo ou solução comum, mesmo com outras palavras.'},
  {id:'ident',nome:'Elementos idênticos',n:d=>CM_CATS.reduce((s,c)=>s+d.ident[c].length,0),intro:'O trecho exato de cada elemento que aparece igual em dois ou mais anúncios, já com as frases vizinhas que também se repetem iguais nos mesmos anúncios. O bloco cresce para cima e para baixo até o ponto em que a contagem cairia. Em cinza, a ideia a que o trecho pertence.'},
  {id:'narr',nome:'Narrativas',n:d=>d.narr?d.narr.lista.length:0,intro:'Qual narrativa (a condução do anúncio até a ideia) cada anúncio usa. Toque numa coluna ou num cartão para ver os anúncios dela. Cada anúncio conta uma vez, pela narrativa principal.'},
  {id:'ads',nome:'Anúncios',n:d=>d.ads.length,intro:'As transcrições completas. Digite um trecho e toque em Busca avançada (ou Enter): aparece cada anúncio que usa o trecho, com duas frases antes e duas depois.'}];
const cmPad=n=>String(n).padStart(2,'0');
const cmNorm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cmNaTela=()=>S.ui.view==='ws'&&S.ui.area==='criativos'&&S.ui.sub.criativos==='auditoria'&&!!proj();
async function cmApi(q){
  const r=await fetch('/api/controle'+q,{headers:API,cache:'no-store'});
  const d=await r.json().catch(()=>({erro:'Resposta inválida do servidor.'}));
  if(!r.ok) throw new Error(d.erro||'Não deu certo.');
  return d;
}
/* o que há no Spy para a oferta em uso reaproveitar; trazer cria atalhos na auditoria (o arquivo continua um só, no Spy) */
async function cmSpy(anunciante,trazer){ const d=CM.dados; if(!d) return; const of=CM.oferta||(d.ofertas.length===1?d.ofertas[0].oferta:''); if(!of) return;
  try{ const r=await fetch(trazer?'/api/controle/importar':'/api/controle/spy',{method:'POST',headers:API,body:JSON.stringify({expert:d.expert,oferta:of,anunciante:anunciante||''})}), j=await r.json(); if(!r.ok) throw new Error(j.erro||'não deu certo');
    CM.spy={de:d.expert+'|'+of,lista:j.spy}; if(trazer){ toast(j.novos?`${j.novos} anúncio${j.novos>1?'s':''} trazido${j.novos>1?'s':''} do Spy`:'Nada novo para trazer'); await cmDados(); } }
  catch(e){ toast(e.message); }
  if(cmNaTela()) cmRender(); }
function cmAoEntrar(){ if(S.servidor&&!CM.ofertas&&!CM.carregando) cmCarregar(); }
async function cmCarregar(){
  CM.carregando=true; CM.erro=null;
  try{
    CM.ofertas=(await cmApi('')).experts;                      // experts com controle de mercado (o nome ficou de antes)
    const p=proj(), lig=p&&ligado(p)?p.expert:null;
    // o expert do projeto é o ponto de partida, não uma trava: o nó Oferta de um flow pode gravar em outro expert, e esse controle também tem que abrir aqui
    const de=(p?p.id:'')+'|'+(lig||'');
    if(CM.de!==de){ CM.de=de; if(!CM.manter&&lig){CM.sel={expert:lig}; CM.oferta='';} }
    CM.manter=false; CM.fixo=!!lig;
    if(CM.sel&&!CM.ofertas.some(o=>o.expert===CM.sel.expert)){CM.sel=null; CM.dados=null;}
    if(!CM.sel&&CM.ofertas.length===1) CM.sel={expert:CM.ofertas[0].expert};
    if(CM.sel) await cmDados();
  }catch(e){ CM.erro=e.message; }
  CM.carregando=false;
  if(cmNaTela()) render();
}
async function cmDados(){
  CM.dados=await cmApi(`/dados?expert=${encodeURIComponent(CM.sel.expert)}${CM.oferta?'&oferta='+encodeURIComponent(CM.oferta):''}${CM.origem?'&base='+encodeURIComponent(CM.origem):''}`);
  if(CM.oferta&&!CM.dados.ofertas.some(o=>o.oferta===CM.oferta)){ CM.oferta=''; return cmDados(); }
  CM.byN=Object.fromEntries(CM.dados.ads.map(a=>[a.n,a])); CM.ad=null; CM.ctx=null;
}
function cmRender(){ const p=document.querySelector('.cm-pane'), y=p?p.scrollTop:0; render(); const n=document.querySelector('.cm-pane'); if(n) n.scrollTop=y; }
function cmChips(l){ return `<div class="cm-chips">${l.map(n=>`<button class="cm-chip mono" data-act="cm-ad" data-id="${n}" title="${esc((CM.byN[n]||{}).titulo||'Anúncio '+cmPad(n))}">${cmPad(n)}</button>`).join('')}</div>`; }
function cmFiltra(l){ const q=cmNorm(CM.q.trim()); return q?l.filter(r=>cmNorm(r.t+' '+(r.g||'')).includes(q)):l; }
function cmLinhas(itens,o){
  o=o||{};
  if(!itens.length) return `<div class="blank glass">${ic('table')}<h3>${CM.q.trim()?'Nada encontrado com essa busca':'Nada aqui ainda'}</h3><p>${CM.q.trim()?'Tente outro trecho.':o.vazio||'Alimente o controle de mercado com mais anúncios.'}</p></div>`;
  const max=Math.max(...itens.map(r=>r.v)), tot=CM.dados.ads.length;
  return `<div class="twrap glass cm-table"><table><thead><tr><th>${o.head||'Argumento'}</th><th>Vezes</th><th>Em quais anúncios</th></tr></thead><tbody>${itens.map((r,i)=>{
    const longo=r.t.length>260, tag=r.f?`<span class="chip">${r.f>1?'parágrafo · '+r.f+' frases':'frase'}</span>`:'';
    return `<tr><td class="cm-arg"><div class="cm-txt ${longo?'clamp':''}" id="cmt${i}">${o.plain?'<b>'+esc(r.t)+'</b>':'“'+esc(r.t)+'”'}</div>${longo?`<button class="cm-more" data-act="cm-mais" data-id="cmt${i}">ver tudo</button>`:''}${tag||r.g?`<div class="cm-meta">${tag}${r.g?`<span>${esc(r.g)}</span>`:''}</div>`:''}</td>
      <td class="cm-v"><b>${r.v}</b>${o.plain?`<i>${Math.round(r.v/Math.max(1,tot)*100)}%</i>`:''}<div class="cm-bar"><span style="width:${Math.max(6,r.v/max*100)}%"></span></div></td>
      <td class="cm-ads">${cmChips(r.a)}</td></tr>`;}).join('')}</tbody></table></div>`;
}
const cmMeu=a=>cmNorm(a.origem).startsWith('propri');
function cmDono(a){ return cmMeu(a)?`<span class="chip">meu</span>${a.validado?`<span class="chip cm-ok">${ic('check')}validado</span>`:''}`:`<span class="chip">concorrente</span>${a.anunciante?`<span>${esc(a.anunciante)}</span>`:''}`; }
function cmAdCard(a,extra){ return `<button class="cm-adcard glass" data-act="cm-ad" data-id="${a.n}"><div class="top"><b>Anúncio ${cmPad(a.n)}</b><span class="mono">${a.dur?a.dur+'s':''}${a.copias>1?' · '+a.copias+' vídeos':''}</span></div><div class="cm-meta">${CM.dados.ofertas.length>1&&!CM.oferta?`<span class="chip on">${esc(a.oferta)}</span>`:''}${cmDono(a)}${a.tipo?`<span>${esc(a.tipo)}</span>`:''}</div>${extra||''}<p>${esc(a.texto)}</p></button>`; }
function cmNarr(){
  const d=CM.dados, L=d.narr.lista, tot=L.reduce((s,x)=>s+x.ads.length,0);
  if(!L.length) return `<div class="blank glass"><p>Nenhuma narrativa identificada nos anúncios ainda.</p></div>`;
  if(!CM.narr||!L.some(x=>x.nome===CM.narr)) CM.narr=L[0].nome;
  const max=Math.max(...L.map(x=>x.ads.length)), W=Math.max(640,L.length*40), H=220, top=22, bot=30, cw=W/L.length, bw=Math.min(30,cw*.62), y=v=>top+(H-top-bot)*(1-v/max);
  const grid=[0,Math.round(max/2),max].map(t=>`<line class="g" x1="0" x2="${W}" y1="${y(t)}" y2="${y(t)}"/>`).join('');
  const cols=L.map((x,i)=>{const cx=i*cw+cw/2, v=x.ads.length, yy=y(v);
    return `<g class="col${x.nome===CM.narr?' on':''}" data-act="cm-narr" data-id="${esc(x.nome)}"><title>${esc(x.nome)} · ${v} anúncios</title><rect x="${i*cw}" y="${top-14}" width="${cw}" height="${H-top+14}" fill="transparent"/><rect class="b" x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(2,H-bot-yy)}" rx="4"/><text x="${cx}" y="${yy-6}" text-anchor="middle">${v}</text><text x="${cx}" y="${H-bot+17}" text-anchor="middle">${esc(x.sig)}</text></g>`;}).join('');
  const sel=L.find(x=>x.nome===CM.narr);
  return `<div class="cm-chart glass"><h3>Anúncios por narrativa · ${tot} anúncios, ${L.length} narrativas</h3><div class="cm-scroll"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px;height:${H}px">${grid}${cols}</svg></div><p>Cada coluna é uma narrativa (o código aparece embaixo). Os números são as do catálogo da biblioteca; N1, N2… são narrativas novas, que surgiram nestes anúncios.</p></div>
    <div class="cm-nlist">${L.map(x=>`<button class="cm-ncard glass ${x.nome===CM.narr?'on':''}" data-act="cm-narr" data-id="${esc(x.nome)}" data-rolar="1"><div class="top"><b><span class="mono">${esc(x.sig)}</span> ${esc(x.nome)}</b><span class="mono">${x.ads.length} · ${Math.round(x.ads.length/tot*100)}%</span></div><div class="cm-meta">${x.nova?'<span class="chip">nova</span>':''}<span>${esc(x.grupo)}</span></div></button>`).join('')}</div>
    <div class="cm-nsec" id="cmnsec"><h3>${esc(sel.nome)} · ${sel.ads.length} anúncio${sel.ads.length===1?'':'s'}</h3>${sel.definicao?`<p>${esc(sel.definicao)}</p>`:''}${sel.estrutura&&sel.estrutura.length?`<p class="est">Estrutura: ${sel.estrutura.map(esc).join(' → ')}</p>`:''}
      <div class="cm-adlist">${sel.ads.map(n=>{const c=d.narr.por[n]||{}; return cmAdCard(CM.byN[n],c.porque?`<p class="why">${esc(c.porque)}</p>`:'');}).join('')}</div></div>`;
}
function cmPlano(t){ const map=[]; let flat=''; for(let i=0;i<t.length;i++){ const c=cmNorm(t[i]); if(/[a-z0-9%]/.test(c)){flat+=c; map.push(i);} } return {flat,map}; }
function cmAchados(t,q){ const nd=cmNorm(q).replace(/[^a-z0-9%]/g,''); if(nd.length<3) return []; const {flat,map}=cmPlano(t), h=[]; let p=flat.indexOf(nd); while(p>=0){ h.push([map[p],map[p+nd.length-1]+1]); p=flat.indexOf(nd,p+nd.length); } return h; }
function cmMarca(t,q){ const h=q?cmAchados(t,q):[]; if(!h.length) return esc(t); let o='',l=0; for(const [a,b] of h){ o+=esc(t.slice(l,a))+'<mark>'+esc(t.slice(a,b))+'</mark>'; l=b; } return o+esc(t.slice(l)); }
function cmFrases(t){ const o=[], re=/[^.?!…]*(?:[.?!…]+|$)/g; let m; while((m=re.exec(t))&&m[0].length) o.push([m.index,m.index+m[0].length]); return o; }
function cmContexto(q){
  if(cmNorm(q).replace(/[^a-z0-9%]/g,'').length<3) return {n:0,html:`<div class="blank glass">${ic('spy')}<h3>Digite pelo menos 3 letras</h3></div>`};
  let n=0, cards='';
  for(const a of CM.dados.ads){
    const hits=cmAchados(a.texto,q); if(!hits.length) continue; n++;
    const fr=cmFrases(a.texto), idx=p=>{const i=fr.findIndex(([x,y])=>p>=x&&p<y); return i<0?fr.length-1:i;}, bl=[];
    for(const [h0,h1] of hits){ const i0=Math.max(0,idx(h0)-2), i1=Math.min(fr.length-1,idx(h1-1)+2), b=bl[bl.length-1]; if(b&&i0<=b.i1+1){b.i1=Math.max(b.i1,i1); b.h.push([h0,h1]);} else bl.push({i0,i1,h:[[h0,h1]]}); }
    const tr=bl.map(b=>{ const s0=fr[b.i0][0], s1=fr[b.i1][1]; let o='', l=s0;
      for(const [h0,h1] of b.h){ const f0=Math.max(l,fr[idx(h0)][0]), f1=fr[idx(h1-1)][1]; o+=esc(a.texto.slice(l,f0))+'<span class="hit">'+esc(a.texto.slice(f0,h0))+'<mark>'+esc(a.texto.slice(h0,h1))+'</mark>'+esc(a.texto.slice(h1,f1))+'</span>'; l=f1; }
      return `<p>${b.i0>0?'… ':''}${(o+esc(a.texto.slice(l,s1))).trim()}${b.i1<fr.length-1?' …':''}</p>`; }).join('');
    cards+=`<div class="cm-ctx glass"><div class="top"><b>Anúncio ${cmPad(a.n)}</b><button class="btn sm" data-act="cm-ad" data-id="${a.n}" data-trecho="${esc(q)}">Abrir transcrição</button></div>${tr}</div>`;
  }
  return {n,html:`<div class="tbar"><b>“${esc(q)}” em ${n} anúncio${n===1?'':'s'}</b><span class="sp"></span><button class="btn sm" data-act="cm-ctx-sair">Voltar para a lista</button></div>`+(n?`<div class="cm-ctxlist">${cards}</div>`:`<div class="blank glass">${ic('spy')}<h3>Nenhum anúncio tem esse trecho</h3></div>`)};
}
function cmDrawer(){
  const a=CM.ad&&CM.byN[CM.ad.n]; if(!a) return '';
  const c=(CM.dados.narr&&CM.dados.narr.por[a.n])||{}, nar=CM.dados.narr&&CM.dados.narr.lista.find(x=>x.ads.includes(a.n));
  return `<div class="cm-scrim" data-act="cm-fechar"></div><aside class="cm-drawer glass" aria-label="Transcrição"><div class="cm-dhead"><div><h3>Anúncio ${cmPad(a.n)}</h3><div class="cm-meta">${a.dur?`<span class="mono">${a.dur}s</span>`:''}<span>${a.copias} vídeo${a.copias>1?'s':''}</span><span class="chip on">${esc(a.oferta)}</span>${cmDono(a)}</div></div>${cmMeu(a)?`<button class="btn sm cm-val ${a.validado?'on':''}" data-act="cm-validar" data-id="${a.n}" title="${a.validado?'Tirar a marca de validado':'Marcar este anúncio como validado (já rodou e deu resultado)'}">${ic('check')}${a.validado?'Validado':'Validar'}</button>`:''}<a class="iconbtn" href="${esc(a.obsidian)}" title="Abrir a nota">${ic('file')}</a><button class="iconbtn" data-act="cm-fechar" title="Fechar">${ic('x')}</button></div>
    <div class="cm-dbody">${nar?`<div class="cm-dnar"><b>${esc((nar.nova?'':nar.sig+' ')+nar.nome)}</b>${a.tipo?` · ${esc(a.tipo)}`:''}${c.porque?`<p>${esc(c.porque)}</p>`:''}</div>`:''}<div class="cm-dtxt">${cmMarca(a.texto,CM.ad.trecho)}</div></div></aside>`;
}
function vAuditoria(){
  if(!S.servidor) return `<div class="blank glass">${ic('table')}<h3>O Controle de mercado precisa do servidor do Octopus IA</h3><p>Abra o Octopus IA por http://localhost:5178.</p></div>`;
  if(CM.erro) return `<div class="blank glass">${ic('table')}<h3>Não deu para abrir o controle de mercado</h3><p>${esc(CM.erro)}</p><button class="btn" data-act="cm-atualizar">Tentar de novo</button></div>`;
  if(!CM.ofertas) return `<div class="blank glass">${ic('table')}<h3>Lendo o cofre…</h3></div>`;
  const vazio=`<div class="blank glass">${ic('table')}<h3>Nenhum controle de mercado ainda</h3><p style="max-width:60ch">O controle de mercado mapeia as dores, os desejos, as promessas, as provas e o mecanismo dos anúncios de uma oferta, e conta em quantos anúncios cada um aparece. Na aba Flows, ligue os anúncios e o nó Oferta num chat e peça: “alimente o meu controle de mercado”. Ele grava direto na oferta.</p><button class="btn solid" data-act="sub" data-id="flows">Ir para os flows</button></div>`;
  if(!CM.ofertas.length) return vazio;
  const pl=proj(), exLig=CM.fixo&&pl?pl.expert:'';

function raioX(raiz){
  const eh=(x,n)=>x.tagName==='H'+n||x.classList.contains('h'+n);
  const h2=raiz&&[...raiz.children].find(h=>eh(h,2)&&/raio-x/i.test(h.textContent)); if(!h2) return;
  const partes=[]; let atual=null, ancora=h2;

    if(eh(x,3)){ atual={nome:x.textContent.trim(),el:document.createElement('div')}; partes.push(atual); x.remove(); }
    else if(atual) atual.el.appendChild(x); else ancora=x;
    x=prox; }
  if(partes.length<2) return;
  const abas=document.createElement('div'); abas.className='seg rx-abas';
  partes.forEach((p,i)=>{ const b=document.createElement('button'); b.textContent=p.nome; b.className=i?'':'on'; p.el.hidden=!!i;
    b.onclick=()=>partes.forEach((q,k)=>{ q.el.hidden=k!==i; abas.children[k].className=k===i?'on':''; }); abas.appendChild(b); });
  const fim=partes[partes.length-1].el; ancora.after(abas); let ant=abas; partes.forEach(p=>{ ant.after(p.el); ant=p.el; });
}

/* ---- nós do flow: conversa, contexto e estado ---- */
function convsDoNo(id){const p=proj(); p.convs=p.convs||{}; return p.convs[id]||[];}
function ultimoDoc(id){
  let melhor=null;
  for(const c of convsDoNo(id)) c.msgs.forEach((m,k)=>{ if(m.doc){const peso=(c.atual||0)+k; if(!melhor||peso>=melhor.peso) melhor={m,peso};} });
  return melhor&&melhor.m;
}
function gDoNo(no){

  return {...def, id:no.id, agente:def.id, noId:no.id, area:{id:'vsl',icon:no.type==='chat'?'chat':no.type==='biblia'?'book':'clip2'}};
}
/* arquivo de um chat por referência: número = documento de uma resposta; "i:k" = texto longo k anexado na mensagem i */
function arquivoRef(msgs,ref){
  if(ref==null) return null;
  /* a VSL ligada ao chat da Bíblia também é um arquivo do chat (o que a pessoa mandou), ao lado da bíblia que sai dela */
  if(typeof ref==='string'&&ref.startsWith('vsl:')){ const n=((flowAtual()||{}).nodes||[]).find(x=>x.id===ref.slice(4)&&x.type==='vsl'); return n?{nome:n.data.nome||'VSL',texto:n.data.texto||'',anexo:true,vsl:true}:null; }
  if(typeof ref==='string'&&ref.includes(':')){ const [i,k]=ref.split(':').map(Number), a=msgs[i]&&(msgs[i].anexos||[])[k]; return a?{nome:a.nome,texto:a.texto,anexo:true,i}:null; }
  const m=msgs[ref]; return m&&m.doc?{nome:docTitulo(m),texto:m.doc,anexo:false,i:ref,m}:null;
}
function contextoDoNo(id){
  /* Contexto = só a etapa anterior: o que está ligado DIRETO no nó. Nada da corrente lá atrás
     (ex.: o chat depois do Briefing não vê a conversa do chat que gerou a bíblia).
     Exceção: um agente (Bíblia/Briefing) ligado direto leva junto o que está ligado nele
     (as bíblias dos campos, o arquivo do chat ligado, inteligências).
     O ChatGPT é o motor, não contexto: vale daqui para trás até achar um, mas só até o primeiro chat.
     Um ChatGPT que já alimenta um chat não passa por ele para alimentar o chat seguinte. */
  const f=flowAtual(), out={gpt:false,modelo:null,itens:[],nomes:[],agentes:[],oferta:null,vsl:null};
  if(!f) return out;
  const nos=f.nodes||[], eds=f.edges||[], acha=x=>nos.find(n=>n.id===x);
  const entradas=x=>eds.filter(e=>e.target===x).map(e=>e.source);
  const eu=acha(id);
  const arquivoDoChat=src=>{ /* arquivo aberto de um chat, ligado aqui */
    const cid=src.slice(3), ch=acha(cid), a=ch&&arquivoRef((convsDoNo(cid)[0]||{msgs:[]}).msgs,ch.data.previa);
    if(a){ out.nomes.push(a.nome+' (arquivo do chat)'); out.itens.push({tipo:'doc',titulo:a.nome+(a.anexo?' (texto enviado no chat do flow)':' (arquivo gerado no chat do flow)'),texto:a.texto}); }
  };
  const ehTr=s=>String(s).startsWith('tr-')||(acha(s)||{}).type==='transcricao';      /* o nó de Transcrição pronto (ou, em flow antigo, o arquivo "tr-…" ao lado dele) */
  const transcricaoDe=src=>{ /* a transcrição de um nó Transcrição, ligado aqui */
    const t=acha(String(src).replace(/^tr-/,'')); if(!t||!t.data.arquivo||t.data.status!=='pronto') return;
    out.nomes.push('Transcrição'); out.itens.push({tipo:'arquivo',titulo:'Transcrição de '+(t.data.video||'vídeo'),flow:f.id,no:t.id,nome:t.data.arquivo});
  };
  const docSolto=n=>{ if(!(n.data.texto||'').trim()) return; out.nomes.push(n.data.nome||'Arquivo'); out.itens.push({tipo:'doc',titulo:(n.data.nome||'Arquivo')+' (arquivo solto no flow)',texto:n.data.texto}); };
  const social=n=>{ const i=n.data.info; if(i){ out.nomes.push('Vídeo do '+i.rede_nome);
        out.itens.push({tipo:n.data.texto?'doc':'texto',titulo:`Vídeo do ${i.rede_nome}: ${i.titulo||i.link}`,texto:[`Link: ${i.link}`,i.autor?`Autor: ${i.autor}`:'',i.segundos!=null?`Duração: ${i.segundos} segundos`:'',i.visualizacoes!=null?`Visualizações: ${i.visualizacoes}`:'',i.curtidas!=null?`Curtidas: ${i.curtidas}`:'',i.legenda?`Legenda do post: ${i.legenda}`:'',
          n.data.texto?`\nTranscrição do que é falado no vídeo:\n${n.data.texto}`:(n.data.semFala?'\n(O vídeo não tem fala: só música ou imagem.)':'\n(O vídeo ainda está sendo processado: por enquanto você só tem os dados acima, não o que é falado nele. Se precisar da fala, peça ao usuário para esperar o nó terminar e mandar a mensagem de novo.)')].filter(Boolean).join('\n')}); } };
  const grupo=g=>{ const de=out.itens.length, nome=(g.data.nome||'').trim();
    nos.filter(x=>x.parentId===g.id).forEach(x=>{ if(x.type==='inteligencia'||x.type==='arquivo') material(x); else if(x.type==='social') social(x); });
    if(nome) for(let i=de;i<out.itens.length;i++) out.itens[i]={...out.itens[i],titulo:`Grupo "${nome}" · ${out.itens[i].titulo}`}; };
  const material=n=>{
    const nome=n.type==='arquivo'?'Inteligência em arquivo':'Inteligência em texto'; out.nomes.push(nome);
    if((n.data.texto||'').trim()) out.itens.push({tipo:'texto',titulo:nome,texto:n.data.texto});
    (n.data.arquivos||[]).forEach(a=>out.itens.push({tipo:'arquivo',titulo:nome,flow:f.id,no:n.id,nome:a.nome}));
  };
  const slots=n=>(n.data.slots||[]).forEach((sl,k)=>{ if(!sl) return;
    if(sl.origem==='cofre') out.itens.push({tipo:'biblia_cofre',titulo:`Bíblia ${k+1} (do cofre)`,caminho:sl.caminho});
    else out.itens.push({tipo:'arquivo',titulo:`Bíblia ${k+1} (arquivo)`,flow:f.id,no:n.id,nome:sl.nome}); });
  const fonte=n=>{ const d=n.data||{}, papel=d.papel||'vsls', rot={tese:'Briefing de tese',biblias:'Bíblia da VSL',vsls:'VSL de referência'}[papel], antes=out.itens.length;
    if(papel==='tese'){ if(d.tese){ out.nomes.push('Briefing de tese'); out.itens.push(d.tese.origem==='cofre'?{tipo:'briefing_cofre',titulo:'Briefing de tese (do cofre)',caminho:d.tese.caminho}:{tipo:'arquivo',titulo:'Briefing de tese (arquivo)',flow:f.id,no:n.id,nome:d.tese.nome}); } }
    else if(papel==='biblias'){ if((d.slots||[]).some(Boolean)) out.nomes.push('Bíblias de VSL'); slots(n); }
    else { if((d.arquivos||[]).length) out.nomes.push('VSLs de referência'); (d.arquivos||[]).forEach((a,k)=>out.itens.push({tipo:'arquivo',titulo:`VSL de referência ${k+1}`,flow:f.id,no:n.id,nome:a.nome})); }
    // o que está ligado NESTA fonte pelo flow (o briefing que saiu de um chat, uma cópia de arquivo, uma transcrição…) entra com o papel dela
    const meio=out.itens.length;
    for(const s3 of entradas(n.id)){
      if(String(s3).startsWith('pv-')){ arquivoDoChat(s3); continue; }
      if(ehTr(s3)){ transcricaoDe(s3); continue; }
      const n3=acha(s3); if(!n3) continue;
      if(n3.type==='doc') docSolto(n3); else if(n3.type==='inteligencia'||n3.type==='arquivo') material(n3); else if(n3.type==='grupo') grupo(n3);
    }
    out.itens.slice(meio).forEach(it=>{ it.titulo=`${rot} — ${it.titulo||'arquivo'}`; });
    if(out.itens.length>meio&&!out.nomes.includes(rot)) out.nomes.push(rot); };
  /* Blocos de VSL → fontes → chat: o conjunto conta como um nó só. Se a fonte (ou o YouTube) vem de um Blocos de VSL, o chat é o agente dos blocos */
  const doConjunto=n=>{ if(entradas(n.id).some(x=>(acha(x)||{}).type==='blocos')&&!out.agentes.includes('blocos')){ out.agentes=['blocos',...out.agentes.filter(x=>x==='youtube')]; out.nomes.push('Blocos de VSL'); } };
  const agente=a=>{ if(a.type==='blocos') return 'Blocos de VSL'; const nome=a.type==='biblia'?'Bíblia da VSL':'Briefing de tese'; const d=ultimoDoc(a.id); if(d) out.itens.push({tipo:'doc',titulo:nome+' (nó do flow)',texto:d.doc}); return nome;};
  // motor: algum ChatGPT antes, em qualquer ponto da corrente. Uma Oferta ligada NO ChatGPT vale para o chat (se não houver outra ligada direto)
  let ofertaDoMotor=null;
  const vistos=new Set([id]); let camada=[id];
  while(camada.length&&!out.gpt){ const prox=[]; for(const x of camada) for(const src of entradas(x)) if(!vistos.has(src)){ vistos.add(src); const n=acha(String(src).startsWith('pv-')?src.slice(3):src); if(!n||n.type==='chat') continue; if(n.type==='chatgpt'){out.gpt=true; out.modelo=n.data.modelo||null; out.nomes.push('ChatGPT'); const o=entradas(n.id).map(acha).find(x=>x&&x.type==='oferta'&&x.data.expert&&x.data.oferta); if(o) ofertaDoMotor=o;} else prox.push(n.id);} camada=prox; }
  // nos flows de Criativos, todo chat já é o agente Copy de anúncio
  if(f.area==='criativos'&&eu&&eu.type==='chat') out.agentes.push('anuncio');
  // contexto: só a etapa anterior
  if(eu&&eu.type==='briefing') slots(eu);
  for(const src of entradas(id)){
    if(String(src).startsWith('pv-')){ arquivoDoChat(src); continue; }
    if(ehTr(src)){ transcricaoDe(src); continue; }
    const n=acha(src); if(!n||n.type==='chatgpt') continue;
    if(n.type==='inteligencia'||n.type==='arquivo'){ material(n); continue; }
    if(n.type==='social'){ social(n); continue; }
    if(n.type==='grupo'){ grupo(n); continue; }
    if(n.type==='doc'){ docSolto(n); continue; }
    if(n.type==='vsl'){ if((n.data.texto||'').trim()&&!out.vsl){ out.vsl=n; out.nomes.push(n.data.nome||'VSL'); out.itens.push({tipo:'doc',titulo:'VSL '+(n.data.nome||''),texto:n.data.texto}); } continue; }
    if(n.type==='fonte'){ fonte(n); doConjunto(n); if((n.data||{}).papel==='vsls'&&!out.itens.some(i=>i.tipo==='blocos_no')) out.itens.push({tipo:'blocos_no',flow:f.id,no:n.id}); continue; }
    if(n.type==='youtube'||n.type==='tiktok'){ if(!out.agentes.includes('youtube')) out.agentes.push('youtube'); out.nomes.push('YouTube'); doConjunto(n); continue; }
    if(n.type==='oferta'){ if(n.data.expert&&n.data.oferta){ out.oferta={expert:n.data.expert,oferta:n.data.oferta}; out.nomes.push('Oferta: '+n.data.oferta); out.itens.push({tipo:'oferta',expert:n.data.expert,oferta:n.data.oferta,vsl:n.data.vsl||'',remessa:((acha(id)||{data:{}}).data.remessa||{}).n||0,ultimoNoChat:ultimoAnuncioNoChat(id)}); } continue; }
    if(n.type==='biblia'||n.type==='briefing'||n.type==='blocos'){
      out.nomes.push(agente(n)); if(!out.agentes.some(x=>x!=='youtube')) out.agentes.unshift(n.type);
      if(n.type==='briefing') slots(n);
      const antesAg=out.itens.length;
      for(const s2 of entradas(n.id)){                       // o que está ligado no agente vai junto
        if(String(s2).startsWith('pv-')){ arquivoDoChat(s2); continue; }
        if(ehTr(s2)){ transcricaoDe(s2); continue; }
        const n2=acha(s2); if(!n2||n2.type==='chatgpt') continue;
        if(n2.type==='inteligencia'||n2.type==='arquivo') material(n2);
        else if(n2.type==='grupo') grupo(n2);
        else if(n2.type==='doc') docSolto(n2);
        else if(n2.type==='fonte'){ fonte(n2); if(n.type==='blocos'&&(n2.data||{}).papel==='vsls'&&!out.itens.some(i=>i.tipo==='blocos_no')) out.itens.push({tipo:'blocos_no',flow:f.id,no:n2.id}); }   // é nesta lista que entra a transcrição que o agente trouxer do YouTube
        else if(n2.type==='youtube'||n2.type==='tiktok'){ if(!out.agentes.includes('youtube')) out.agentes.push('youtube'); out.nomes.push('YouTube'); }
        else if(n2.type==='oferta'){ if(n2.data.expert&&n2.data.oferta&&!out.oferta){ out.oferta={expert:n2.data.expert,oferta:n2.data.oferta}; out.nomes.push('Oferta: '+n2.data.oferta); out.itens.push({tipo:'oferta',expert:n2.data.expert,oferta:n2.data.oferta,vsl:n2.data.vsl||''}); } }
        else if(n2.type==='biblia'||n2.type==='briefing') out.nomes.push(agente(n2));
      }
      if(n.type==='briefing'){ let nb=(n.data.slots||[]).filter(Boolean).length; out.itens.slice(antesAg).forEach(it=>{ if(it.tipo==='doc'||it.tipo==='texto'||it.tipo==='arquivo') it.titulo=`Bíblia ${++nb} — ${it.titulo||'arquivo'}`; }); }
    }
  }
  if(!out.oferta&&ofertaDoMotor){ const d=ofertaDoMotor.data; out.oferta={expert:d.expert,oferta:d.oferta}; out.nomes.push('Oferta: '+d.oferta); out.itens.push({tipo:'oferta',expert:d.expert,oferta:d.oferta,vsl:d.vsl||''}); }
  return out;
}
/* ---- Bíblia da VSL por partes: uma seção do modelo por mensagem, sem histórico. As partes ficam guardadas no nó da VSL e o app monta o arquivo ---- */
const BIB_PADRAO=['Núcleo de conversão','Dores','Desejos','Promessas','Soluções comuns','Crenças','Objeções','Narrativa da VSL','Nome chiclete','Provas','Elementos usados','Produto','Estrutura da VSL','Mecanismo'];
function bibEtapas(){
  if(!S.bibModelo&&!S.bibModeloPedido&&S.servidor){ S.bibModeloPedido=true;
    fetch('/api/nota?caminho='+encodeURIComponent('Biblioteca/Modelos/Bíblia do nicho.md'),{headers:API,cache:'no-store'}).then(r=>r.ok?r.json():null).then(n=>{ const e=n?[...n.corpo.matchAll(/^## (\d+)\. (.+)$/gm)].map(m=>m[2].trim()):[]; if(e.length) S.bibModelo=e; if(window.AtlasFlow) AtlasFlow.refresh(); }).catch(()=>{}); }
  return S.bibModelo||BIB_PADRAO;
}
/* só valem as partes do modelo atual: cada uma começa com o título "## N. nome" dele. Parte feita com um modelo antigo é montada de novo */
function bibValidas(partes){ const et=bibEtapas(), out={}; Object.entries(partes||{}).forEach(([k,t])=>{ if(et[k-1]&&String(t).trim().split('\n')[0].trim().toLowerCase()===`## ${k}. ${et[k-1]}`.toLowerCase()) out[k]=t; }); return out; }
function bibEstado(vsl){ const et=bibEtapas(), partes=bibValidas(vsl&&vsl.data.partes); let feitas=0; while(feitas<et.length&&partes[feitas+1]) feitas++;

/* links: [texto](https://…) e endereços soltos viram clicáveis (só http/https, abrem em outra aba) */
function linkar(h){
  const a=(u,t)=>`<a class="lk" href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`;
  return h.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,t,u)=>a(u,t))
          .replace(/(^|[\s(>])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g,(_,p,u)=>p+a(u,u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60)+(u.length>70?'…':'')));
}
function inl(s){return linkar(esc(s)).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'<span class="wl">$2</span>').replace(/\[\[([^\]]+)\]\]/g,'<span class="wl">$1</span>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function separaFM(src){let t=String(src||'').replace(/\r/g,''), fm=null; if(t.startsWith('---\n')){const e=t.indexOf('\n---',4); if(e>0){fm=t.slice(4,e); t=t.slice(e+4).replace(/^\n+/,'');}} return {fm,t};}
function mdHTML(t){
  const L=t.split('\n'), out=[]; let i=0;
  const cel=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  while(i<L.length){
    const l=L[i]; let m;
    if(!l.trim()){i++;continue}
    if(l.startsWith('```')){const b=[];i++;while(i<L.length&&!L[i].startsWith('```'))b.push(L[i++]);i++;out.push(`<pre>${esc(b.join('\n'))}</pre>`);continue}
    if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push(`<div class="h${m[1].length}">${inl(m[2])}</div>`);i++;continue}
    if(l.startsWith('>')){const b=[];while(i<L.length&&L[i].startsWith('>'))b.push(L[i++].replace(/^>\s?/,''));
      const c=b[0].match(/^\[!(\w+)\]\s*(.*)/); if(c)b.shift();
      out.push(`<div class="callout">${c?`<div class="ct">${inl(c[2]||c[1])}</div>`:''}${mdHTML(b.join('\n'))}</div>`);continue}
    if(l.trim().startsWith('|')){const b=[];while(i<L.length&&L[i].trim().startsWith('|'))b.push(L[i++]);
      const rows=b.filter(r=>!/^\|?\s*:?-{2,}/.test(r.trim().replace(/^\|/,''))).map(cel);
      out.push(`<div class="tw"><table><thead><tr>${rows[0].map(x=>`<th>${inl(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${inl(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue}
    if(/^\s*[-*]\s+/.test(l)){const b=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))b.push(L[i++].replace(/^\s*[-*]\s+/,''));out.push(`<ul>${b.map(x=>`<li>${inl(x)}</li>`).join('')}</ul>`);continue}
    if(/^\s*\d+\.\s+/.test(l)){const b=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i]))b.push(L[i++].replace(/^\s*\d+\.\s+/,''));out.push(`<ol>${b.map(x=>`<li>${inl(x)}</li>`).join('')}</ol>`);continue}
    const b=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|>|\||\s*[-*]\s|\s*\d+\.\s|```)/.test(L[i]))b.push(L[i++]);
    out.push(`<p>${b.map(inl).join('<br>')}</p>`);
  }
  return out.join('');
}

    if(k===atual) return; atual=k; const ant=box.querySelector('.tr-g.on'); if(ant) ant.classList.remove('on');
    const at=k>=0?box.querySelector('.tr-g[data-k="'+k+'"]'):null; if(at){ at.classList.add('on'); if(!box.matches(':hover')){ const r=at.getBoundingClientRect(), b=box.getBoundingClientRect(); if(r.top<b.top+40||r.bottom>b.bottom-60) at.scrollIntoView({block:'center',behavior:'smooth'}); } } };

  const tecla=e=>{ if(e.key==='Escape') fechar(); }; document.addEventListener('keydown',tecla);

/* ---- Ditado: o microfone dos chats. Clica para gravar, clica de novo para parar; o Whisper transcreve no computador e o texto entra no campo ---- */
window.AtlasDitado=(()=>{ let rec=null, fluxo=null, dono=null;
  const estado=e=>{ if(dono) dono.estado(e); };
  async function alternar(alvo){            // alvo: {estado(e), texto(t)}; e = '' | 'gravando' | 'transcrevendo'
    if(rec){ if(rec.state==='recording') rec.stop(); return; }
    if(dono) return;                         // outro chat ainda está transcrevendo
    try{ fluxo=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}}); }
    catch(e){ toast('Sem acesso ao microfone. Libere o microfone para este endereço no navegador.'); return; }
    const tipo=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    const pedacos=[]; dono=alvo;
    try{ rec=new MediaRecorder(fluxo,tipo?{mimeType:tipo}:undefined); }catch(e){ fluxo.getTracks().forEach(t=>t.stop()); dono=null; toast('Este navegador não grava áudio.'); return; }
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) pedacos.push(e.data); };
    rec.onstop=async()=>{ fluxo.getTracks().forEach(t=>t.stop()); const blob=new Blob(pedacos,{type:rec.mimeType||tipo||'audio/webm'}); rec=null;
      if(blob.size<1200){ estado(''); dono=null; return; }
      estado('transcrevendo');
      try{ const r=await fetch('/api/fala',{method:'POST',headers:{'X-Atlas':'1','Content-Type':blob.type},body:blob}), j=await r.json(); if(!r.ok) throw new Error(j.erro||'não deu para transcrever');
        if(j.texto) dono.texto(j.texto); else toast('Não ouvi nada na gravação.'); }
      catch(e){ toast(e.message==='Failed to fetch'?'Servidor local fora do ar.':e.message); }
      estado(''); dono=null; };
    rec.start(); estado('gravando');
  }
  return {alternar}; })();
